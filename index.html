<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QR Code</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      text-align: center;
      background: #ffffff;
      padding: 32px 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    h1 {
      margin-bottom: 20px;
      font-size: 1.6rem;
      color: #333;
    }

    #qrcode {
      display: inline-block;
      padding: 16px;
      background: #fafafa;
      border-radius: 12px;
      box-shadow: inset 0 0 0 1px #e0e0e0;
    }

    .caption {
      margin-top: 16px;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>QR Code Informativo</h1>
    <div id="qrcode"></div>
    <div class="caption">Escaneie para visitar o Portal da Unioeste</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
    new QRCode(document.getElementById("qrcode"), {
      text: "https://unioeste.br/",
      width: 256,
      height: 256,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });
  </script>
</body>
</html>
